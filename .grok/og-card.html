  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;

  .stage {
    position: relative;

    height: 630px;
  }
  .stage svg {
    position: absolute;
    inset: 0;
    display: block;
  }
  .lockup {
    position: absolute;
    left: 180px;
    right: 180px;
    top: 268px;
    text-align: center;
    color: #F6F3EC;
    font-family: "Narrow", "Liberation Sans Narrow", sans-serif;

  .kicker {
    font-weight: 700;
    font-size: 46px;
    letter-spacing: 0.42em;
    color: #F6F3EC;
    line-height: 1;
    margin-bottom: 4px;
  }
  .word {
    font-weight: 700;
    font-size: 118px;
    letter-spacing: 0.035em;
    line-height: 0.8;
    color: #F6F3EC;
  }
  .rule {
    width: 160px;
    height: 2px;
    margin: 10px auto 10px;
    background: #E3B341;
    opacity: 0.9;
  }
  .tag {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #E3B341;
    line-height: 1;
  }
  .kicker span,
  .tag span {
    display: inline-block;
  }
  .kicker span { padding-left: 0.42em; }
  .tag span { padding-left: 0.3em; }
</style>
